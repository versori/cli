      description: |
        Used to exchange an authorization code for an access token and
        is denoted by the `oauth2-code` type.
        This is only used when creating or updating an OAuth 2.0 connection using the
        `authorization_code` grant type. Retrieving this credential will return a payload of
        type `oauth2-token` in the shape of a `CredentialDataOAuth2Token` object.
      type: object
      properties:
        code:
          description: |
            The authorization code which will be exchanged for an access token.
          type: string
        state:
          description: |
            The state value which is propagated through the OAuth2 flow.
          type: string
        redirectUrl:
          description: |
            The URL which the user will be redirected to after authorising the application.
          type: string
          format: uri
          x-go-name: RedirectURL
        additionalParams:
          description: |
            A URL-encoded query string which can be used to pass additional
            parameters to the OAuth 2.0 token endpoint. These parameters are attached to the body
            in the formatted as the `application/x-www-form-urlencoded` content-type.
          type: string
          x-go-type-skip-optional-pointer: true
      required:
