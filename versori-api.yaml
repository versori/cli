    GitProviderType:
      description: |
        GitProviderType identifies which Git host the configuration applies to.
      type: string
      enum:
        - gitlab
        - github

    InitialiseGitOAuthRequest:
      description: |
        The body for `InitialiseGitOAuth`. The frontend supplies the redirect URI it will
        listen on; the backend validates this is the same value registered with the provider's OAuth application.
      type: object
      properties:
        redirectUri:
          description: The redirect URI the OAuth provider should send the user back to after authorisation.
          type: string
          format: uri
      required:
        - redirectUri

    InitialiseGitOAuthResponse:
      type: object
      properties:
        authorizeUrl:
          description: Fully-formed authorisation URL the frontend should open in a popup.
          type: string
          format: uri
        state:
          description: |
            Opaque state token. The frontend should not interpret this; it's persisted server-side and validated on
            `CompleteGitOAuth`.
          type: string
      required:
        - authorizeUrl
        - state

    CompleteGitOAuthRequest:
      type: object
      properties:
        code:
          description: Authorisation code returned by the provider on the redirect URI.
          type: string
        state:
          description: Opaque state token previously returned by `InitialiseGitOAuth`.
          type: string
        redirectUri:
          description: |
            The redirect URI used when initialising. Must match exactly — the OAuth 2.0 spec requires the same value
            on the token exchange as on the authorize request.
          type: string
          format: uri
      required:
        - code
        - state
        - redirectUri

