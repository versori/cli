  /o/{organisation_id}/projects/{project_id}/environments/{environment_id}/workflows/peek:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/environment_id"
    get:
      operationId: PeekWorkflows
      summary: Peek at workflows without locking them.
      description: |
        Peek returns workflows without locking them so they can still be fetched
        by workers.
      tags:
        - workflows
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: |
              Optional status filter. One of 'available', 'locked', 'completed', 'failed'.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            description: Maximum number of workflows to return. Defaults to 10, max 100.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: |
              Opaque cursor for keyset pagination, taken from `pagination.nextCursor`
              of a previous response. Must be the id of the last workflow on that page.
              When `order` is `desc` (default), returns workflows with id less than
              the cursor. When `order` is `asc`, returns workflows with id greater than
              the cursor. Use the same `order` value as the request that produced the cursor.
        - name: order
          in: query
          required: false
          schema:
            type: string
            description: Sort workflows by id. Defaults to desc.
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeekWorkflowsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

