openapi: 3.0.3
info:
  title: Versori Platform API
  version: 0.0.1
  license:
    name: UNLICENSED
servers:
  - description: Production
    url: https://platform.versori.com/api/v2
  - description: Staging
    url: https://platform-staging.versori.com/api/v2
  - description: Development
    url: http://localhost:8901
paths:
  /o/{organisation_id}/activations:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    post:
      operationId: ActivateUser
      summary: Activates a User on an Environment.
      description: |
        ActivateUser activates a user on an environment. This will create a new activation record for the user on the environment.
        Connections must be made for all environment systems to be successfully activated.
      tags:
        - end_users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationCreate"

  /o/{organisation_id}/execution-pools:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListExecutionPools
      summary: List available execution pools.
      tags:
        - execution_pools
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPoolList"

  /o/{organisation_id}/projects:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListProjects
      summary: List projects for organisation
      tags:
        - projects
      parameters:
        - name: starred
          in: query
          required: false
          description: If true, return only projects that have been starred.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: CreateProject
      summary: Create new project
      description: |
        CreateProject creates a new project.
      tags:
        - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: GetProject
      summary: Get Project
      description: |
        GetProject returns the files and configuration for the specified project ID. If one does not exist then a 404 will be returned.
      tags:
        - projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: DeleteProject
      summary: Delete Project
      description: |
        DeleteProject delete the project.
      tags:
        - projects
      responses:
        "204":
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: UpdateProject
      summary: Update Project
      description: |
        UpdateProject updates the project record. This endpoint will not make changes to the file or the running deployment.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/clone:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: CloneProject
      summary: Clone Project
      description: |
        CloneProject clones the project with the given ID. The new project will have a new ID and will not be deployed.
        The files and configuration will be copied from the original project. Connection templates will be copied, however
        no connections will be created.
      tags:
        - projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/star:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    put:
      operationId: StarProject
      summary: Star Project
      description: |
        StarProject marks the project as starred for the organisation. Starred projects are highlighted
        as containing useful reference patterns.
      tags:
        - projects
      responses:
        "204":
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: UnstarProject
      summary: Unstar Project
      description: |
        UnstarProject removes the starred marker from the project.
      tags:
        - projects
      responses:
        "204":
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/environments/clone:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: CloneEnvironment
      summary: Clone Environment
      description: |
        CloneEnvironment creates a new environment by copying the details of an existing environment in the same project.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneEnvironmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/environments/{environment_id}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/environment_id"
    post:
      operationId: DeleteEnvironment
      summary: Delete Environment
      description: |
        DeleteEnvironment will unpublish and remove an environment from the project.
      tags:
        - projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/environments/sync:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: SyncEnvironments
      summary: Sync Environments
      description: |
        SyncEnvironments copies the deployment configuration (currently the deployed docker image/version) from one
        environment to another within the same project.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEnvironmentsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/variables:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    put:
      operationId: SetProjectVariablesSchema
      summary: Set the schema for the project variables
      description: |
        SetProjectVariablesSchema sets the JSON schema for the project's dynamic variables. Dynamic variables can then
        be set by end users on activation. This schema is used to validate the variables when they are set and defines
        the variables that can be set and used within the integration code.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicVariablesSchema"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVariablesSchema"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: GetProjectVariablesSchema
      summary: Get project variables
      description: |
        GetProjectVariablesSchema returns the variables schema for the project.
      tags:
        - projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVariablesSchema"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: PatchProjectVariablesSchema
      summary: Patch the schema for the project's dynamic variables
      description: |
        PatchProjectVariablesSchema patches the JSON schema for the project's dynamic variables. This allows you to add,
        remove or edit the schema for the project's dynamic variables.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicVariablesSchemaPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicVariablesSchema"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/sdk-major-version:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: ChangeProjectSDKMajorVersion
      summary: Changes the SDK major version that is used for the project
      description: |
        Changes the major version of the versori run SDK that is used for the project.
        The SDK version can either be 0 or 1 corresponding to the major version of the.
        Hence 0 -> v0.x.x and 1 -> v1.x.x.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SDKMajorVersionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /o/{organisation_id}/projects/{project_id}/versions:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: ListProjectVersions
      summary: Lists versions for a project
      description: |
        List all versions of a project.
      tags:
        - versions
      parameters:
        - $ref: "#/components/parameters/first"
        - $ref: "#/components/parameters/after"
        - $ref: "#/components/parameters/before"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
    post:
      operationId: CreateProjectVersion
      summary: Create a new version for a project.
      description: |
        Create a new version for a project.
      tags:
        - versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectVersion'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectVersion'

  /o/{organisation_id}/projects/{project_id}/versions/{version_id}/files:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/version_id"
    get:
      operationId: GetVersionFiles
      summary: Get Files for a given version
      description: |
        Retrieves the files for the given version ID and project ID.
      tags:
        - versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files'

  /o/{organisation_id}/projects/{project_id}/files:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: GetFiles
      summary: Get Files
      description: |
        GetFiles returns the current files for the project. Those may not be the files that the project is deployed with.
      tags:
        - projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: UpdateFiles
      summary: Update Files
      description: |
        UpdateFiles updates the files for the project. This will not deploy the project.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Files"
      responses:
        "204":
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: PatchFiles
      summary: Patch Files
      description: |
        PatchFiles updates only the files that are specified in the payload.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Files"
      responses:
        "204":
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/repo/sync:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: SyncProjectRepo
      summary: Sync Project Files To Repository
      description: |
        Sync project files to the configured Git repository. This can create or update files on a source branch
        and optionally create a merge request to a target branch.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoSyncRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSyncResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/repo/pull:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: PullProjectRepo
      summary: Pull Project Files From Repository
      description: |
        Pull the project files tarball from the configured Git repository branch and replace the current project files.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPullRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPullResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/repo/files:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: ListProjectRepoFiles
      summary: List Repository Files
      description: |
        List files from the configured repository for the project.
      tags:
        - projects
      parameters:
        - in: query
          name: ref
          schema:
            type: string
          required: false
          description: Git branch or ref to list files from.
        - in: query
          name: path
          schema:
            type: string
          required: false
          description: Optional directory path filter.
        - in: query
          name: recursive
          schema:
            type: boolean
            default: true
          required: false
          description: Whether to list files recursively.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoFileListResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/repo/merge-requests:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: CreateProjectRepoMergeRequest
      summary: Create Project Repository Merge Request
      description: |
        Create a merge request for a project repository branch.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoMergeRequestCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoMergeRequestResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/environments/execution-pools:
    parameters:
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/project_env"
      - $ref: "#/components/parameters/organisation_id"
    put:
      operationId: ChangeEnvironmentExecutionPool
      summary: Change the execution pool of an environment
      description: |
        Updates the execution pool used to deploy this environment. If the environment is running it will be suspended first.
        This will result in a new public URL being created for the environment.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEnvironmentExecutionPoolRequest"
      responses:
        "200":
          description: Variables updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvironment"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/environments/call:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/project_env"
    post:
      operationId: CallIntegration
      summary: Call Integration
      description: |
        CallIntegration sends an HTTP request to a project's deployed environment and returns the response.
        This allows triggering a project remotely via an HTTP call.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCallHTTPRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationCallHTTPResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/deploy:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/project_env"
    put:
      operationId: DeployProject
      summary: Deploy Project
      description: |
        DeployProject deploys the project to the specified environment using the current files.
        It processes the files to deploy a new version of the project and updates the underlying connector
        to integrate the new API.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDeployPayload"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/versions/{version_id}/deploy:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/project_env"
      - $ref: "#/components/parameters/version_id"
    put:
      operationId: DeployProjectVersion
      summary: Deploy Project Version
      description: |
        DeployProjectVersion deploys the project to the specified environment using the specified version.
        If the docker image is not build for the version it will build one.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectVersionDeploy"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/testing/start:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: StartTestContainer
      summary: Start Test Container
      description: |
        StartTestContainer starts a test container for the project. The test container is a temporary
        environment that can be used to test the project.
        This endpoint will available triggers for the project.
      tags:
        - projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTriggers"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/testing/agent/start:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: StartTestAgent
      summary: Start Agentic Code Review
      description: |
        StartTestAgent triggers Claude Code to review and fix the files currently
        loaded in the running test container. The test container must already be
        running; this endpoint will not cold-start it.

        The supervisor streams Claude's output and a final claude_done event over
        the project websocket. By the time claude_done is broadcast, any fixed files
        have already been persisted to one-api.
      tags:
        - projects
      responses:
        "202":
          description: Accepted - agent run has been triggered
        "409":
          description: Conflict - an agent run is already in progress for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Precondition Failed - test container is not running or has no files loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/testing/agent/stop:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    post:
      operationId: StopTestAgent
      summary: Stop Agentic Code Review
      description: |
        StopTestAgent cancels any in-flight Claude Code review on the running
        test container. Idempotent: if no agent run is in progress (because
        none was started, or it already finished), this still succeeds with
        204 No Content. Idempotent specifically so the UI can fire-and-forget
        on panel close / unmount without having to track session state.

        On success, the supervisor cancels the active phase, kills the Claude
        subprocess, and broadcasts a final claude_done event with status
        "cancelled" over the project websocket.
      tags:
        - projects
      responses:
        "204":
          description: No Content - any in-flight agent run has been cancelled
        "412":
          description: Precondition Failed - test container is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/testing/trigger/{trigger_name}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - name: trigger_name
        in: path
        required: true
        schema:
          type: string
    post:
