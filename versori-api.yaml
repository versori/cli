  /o/{organisation_id}/projects/{project_id}/traces:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/project_env"
    get:
      operationId: ListTraces
      summary: List project traces
      description: |
        ListTraces returns a list of traces for the given organisation.
      tags:
        - projects
      parameters:
        - name: next_token
          in: query
          required: false
          schema:
            type: string
        - name: start
          in: query
          required: false
          schema:
            type: string
        - name: end
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
            description: |
              Filter executions by attribute.
              
              Example query: 'http.request.method:POST executionId:01JSPK1SB6S622T6E1P9BBJTWP'
              
              Available attributes are:
              - "taskId"
              - "taskType"
              - "executionId"
              - "error.message"
              - "error.stack"
              - "schedule"
              - "connection"
              - "http.request.method"
              - "http.response.status_code"
              - "server.address"
              - "server.port"
              - "url.full"
              - "url.path"
              - "url.query"
              - "url.scheme"
        - name: error
          in: query
          required: false
          schema:
            type: boolean
        - name: task
          in: query
          required: false
          schema:
            type: string

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceSearch"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

