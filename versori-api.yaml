    AdditionalParam:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name


    CredentialDataBinary:
      title: Binary
      description: |
        Commonly used to store non-string data such as binary files or encryption keys. This
        value will be redacted when returned in a response.
      type: object
      properties:
        valueBase64:
          type: string
          description: |
            Value is a base64 encoded string containing the credential data. This could decode to a valid utf-8 string,
            or it could decode to a binary file such as a private key etc. When read from the API this field will be
            redacted.
      required:
        - valueBase64

    AuthSchemeConfig:
      type: object
      description: |
        An AuthSchemeConfig describes how credentials should be used to authenticate with a System, an example being where
        an API key should be sent and what the header/query parameter/cookie name is. For OAuth2, this config object also
        contains data such as the token URL, client ID and secret, and scopes to request.
        This type contains a string called `type` which denotes which field in this object should be populated.
        For example if the `type` is `api-key`, then the `apiKey` field will be populated with an
        `AuthSchemeConfigAPIKey` object.
      properties:
        type:
          $ref: "#/components/schemas/AuthSchemeType"
        none:
          $ref: "#/components/schemas/AuthSchemeConfigNone"
        apiKey:
          $ref: "#/components/schemas/AuthSchemeConfigAPIKey"
        basicAuth:
          $ref: "#/components/schemas/AuthSchemeConfigBasicAuth"
        oauth2:
          $ref: "#/components/schemas/AuthSchemeConfigOAuth2"
        oauth1:
          $ref: "#/components/schemas/AuthSchemeConfigOAuth1"
        hmac:
          $ref: "#/components/schemas/AuthSchemeConfigHMAC"
        certificate:
          $ref: "#/components/schemas/AuthSchemeConfigCertificate"
      required:
        - type

    AuthSchemeConfigAPIKey:
      title: API Key
      description: |
        How a Connector uses an API key credential to authenticate with the system.
      type: object
      allOf:
        - $ref: "#/components/schemas/AuthSchemeConfigBase"
        - type: object
          properties:
            name:
              type: string
              description: The query parameter/header/cookie name which will be used to send the API key.
            in:
              $ref: "#/components/schemas/AuthSchemeConfigAPIKeyIn"
          required:
            - name
            - in

    AuthSchemeConfigAPIKeyIn:
      description: |
        The location of the API key in the request.
      type: string
      enum:
        - query
        - header
        - cookie

    AuthSchemeType:
      description: |
        Unique kebab-case identifier of the AuthScheme, see
        enum values for possible options.
      type: string
      enum:
        - none
        - api-key
        - basic-auth
        - oauth2
        - hmac
        - jwt-bearer
        - certificate
        - oauth1
        - secret
    OAuth2Scope:
      description: |
        A single scope which can be requested by an OAuth2 application.
      type: object
      properties:
        name:
          type: string
          description: |
            The name of the scope as determined by the application to which this Connector
            is connecting to.
        description:
          type: string
          description: |
            Human-friendly explanation of the scope. This text may be
            displayed to users via a help tooltip or similar.
          x-go-type-skip-optional-pointer: true
      required:
        - name
    AuthSchemeConfigBase:
      type: object
      properties:
        id:
          type: string
          format: ulid
          description: |
            The unique identifier of the AuthSchemeConfig, this is generated by the client and
            only requires to be unique amongst the elements of the array in which is it contained.
          x-go-name: ID
        description:
          description: |
            Helps users distinguish multiple configurations which use the same
            schemeType.
          type: string
        validationMessages:
          description: |
            A list of messages which are generated when the AuthSchemeConfig
            is validated. This is typically used to provide feedback to the user when they are
            creating or updating the AuthSchemeConfig.

            This field will be ignored if sent to the API.
          type: array
          items:
            $ref: "#/components/schemas/Message"
          x-go-type-skip-optional-pointer: true
      required:
        - id
        - description
    AuthSchemeConfigOAuth2GrantType:
      type: string
      enum:
        - authorizationCode
        - clientCredentials
        - password
    AuthSchemeConfigOAuth2GrantAuthorizationCode:
      title: authorization_code
      description: |
        Grant-specific configuration for the
        `authorization_code` grant type.

        How the API manages changes to this configuration is as follows:

        - CredentialID and OrganisationID are not set, a new credential is created containing the
          sensitive information and the non-sensitive information is updated in the database.
        - Otherwise, both the credential and the database are updated using JSON Merge Patch, with
          undefined properties not being updated.
        - Any other permutation will result in a 400 Bad Request.
      type: object
      properties:
        credentialId:
          description: |
            The unique identifier of the Credential which contains the client ID and
            client secret to be used as part of the `password` flow.
          type: string
          format: ulid
          x-go-name: CredentialID
          x-go-type: ulid.ULID
          x-go-type-import:
            path: github.com/versori/cli/pkg/ulid
          x-go-type-skip-optional-pointer: true
        organisationId:
          description: |
            The unique identifier of the Organisation that owns the Credential.
            This can be different to the Connector's OrganisationID since some may be imported from
            Versori's public library.
          type: string
          format: ulid
          x-go-name: OrganisationID
          x-go-type: ulid.ULID
          x-go-type-import:
            path: github.com/versori/cli/pkg/ulid
          x-go-type-skip-optional-pointer: true
        clientId:
          description: |
            The OAuth 2.0 client's identifier. This is not a sensitive value and may be
            presented to the user in plaintext.
          type: string
          x-go-name: ClientID
        clientSecret:
          description: |
            The OAuth 2.0 client's secret. This is a sensitive value and will not be
            displayed to the user.
          type: string
      required:
        - grantType
    AuthSchemeConfigOAuth2GrantClientCredentials:
      title: client_credentials
      type: object
    AuthSchemeConfigOAuth2GrantPassword:
      title: password
      description: |
        Grant-specific configuration for the `password`
        grant type.

        How the API manages changes to this configuration is as follows:

        - CredentialID and OrganisationID are not set, a new credential is created containing the
          sensitive information and the non-sensitive information is created/updated in the
          database.
        - Otherwise, both the credential and the database are updated using JSON Merge Patch.
        - Any other permutation will result in a 400 Bad Request.
      type: object
      properties:
        credentialId:
          description: |
            The unique identifier of the Credential which contains the client ID and
            client secret to be used as part of the `password` flow.
          type: string
          format: ulid
          x-go-name: CredentialID
          x-go-type: ulid.ULID
          x-go-type-import:
            path: github.com/versori/cli/pkg/ulid
          x-go-type-skip-optional-pointer: true
        organisationId:
          description: |
            The unique identifier of the Organisation that owns the Credential. This can be different
            to the Connector's OrganisationID since some may be imported from Versori's public library.
          type: string
          format: ulid
          x-go-name: OrganisationID
          x-go-type: ulid.ULID
          x-go-type-import:
            path: github.com/versori/cli/pkg/ulid
          x-go-type-skip-optional-pointer: true
        clientId:
          description: |
            The OAuth 2.0 client's identifier. This is not a sensitive value and may be presented to the
            user in plaintext.
          type: string
          x-go-name: ClientID
        clientSecret:
          description: |
            The OAuth 2.0 client's secret. This is a sensitive value and will not be displayed to the
            user. It may be populated when updating the Credential.
          type: string
      required:
        - grantType
    AuthSchemeConfigOAuth2Grant:
      type: object
      properties:
        authorizationCode:
          $ref: "#/components/schemas/AuthSchemeConfigOAuth2GrantAuthorizationCode"
        clientCredentials:
