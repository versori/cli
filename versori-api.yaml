        `secret` property will be redacted when returned in a response.
      type: object
      properties:
        algorithm:
          type: string
          enum:
            - HS256
            - HS384
            - HS512
            - RS256
            - RS384
            - RS512
        secret:
          type: string
          description: |
            The base64 encoded secret used to sign new JWTs.
        payload:
          description: |
            Stringified JSON object containing the default set of claims to include in the JWT payload.
            Issued JWTs may contain additional claims and may overwrite ones defined here, such as `exp` and `iat`.
          type: string
        expiresIn:
          description: |
            Expires in is a duration in the form `1h2m3s` (see Go's `time.Duration` documentation) which defined
            how long a newly issued JWT should be valid for.
          type: string
          examples:
            - 24h
            - 30m
            - 120s
            - 1m30s
        authorizationHeaderPrefix:
          description: |
            The prefix to use when setting the Authorization header, for example,
            "Bearer" or "JWT".
          type: string
      required:
        - algorithm
        - secret
        - payload
        - expiresIn
        - authorizationHeaderPrefix
