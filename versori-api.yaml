  /o/{organisation_id}/issues:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListIssues
      parameters:
        - $ref: "#/components/parameters/first"
        - $ref: "#/components/parameters/after"
        - $ref: "#/components/parameters/before"
        - name: search_date
          in: query
          description: |
            Which field drives ordering and cursor pagination (`before` / `after`).
            If not provided, defaults to createdAt.
            For createdAt and lastSeenAt, use RFC3339 timestamps in before/after.
            For seenCount, before/after are decimal integers as strings (occurrence counts).
          schema:
            type: string
            enum:
              - createdAt
              - lastSeenAt
              - seenCount
        - name: sort_direction
          in: query
          description: |
            Which direction to order issues in.
            If not provided, defaults to descending.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: status
          in: query
          style: form
          explode: true
          description: |
            Filter issues by status. Repeat this parameter to match multiple statuses (e.g. open and acked).
            Valid values: 'open', 'closed', 'acked', 'resolved'.
            If not provided, only open issues are returned unless all_statuses is true.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IssueStatusEnum'
        - name: all_statuses
          in: query
          description: |
            When true, return issues of any status (status query parameter still applies if set).
            When false or omitted, missing status defaults to open issues only.
          schema:
            type: boolean
        - name: project_id
          in: query
          description: |
            Filter issues by project ID. If not provided, issues from all projects are returned.
