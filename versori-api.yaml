          description: A list of scopes which the user has granted consent for.
        accessToken:
          type: string
          description: |
            The OAuth2 access token which can be used to authenticate with the Connector. This
            information is redacted when read from the API.
          x-go-type-skip-optional-pointer: true
        tokenType:
          type: string
          description: |
            The type of token which is being issued. Defaults to "Bearer" if not set.
          default: Bearer
          x-go-type-skip-optional-pointer: true
        expiresAt:
          type: string
          format: date-time
          description: |
            The time at which the access token will expire. If not defined, the accessToken will be
            reused until a 401 response is received from the Connector, at which point the token should be refreshed
            with the provided `refreshToken`. Ideally this should be provided so that erroneous failures can be
            avoided.
          x-go-type-skip-optional-pointer: true
        refreshToken:
          type: string
          description: |
            The OAuth2 refresh token which can be used to issue new access tokens. This information is
            redacted when read from the API.

            This is a required field as it is used to refresh the access token when it expires. If users are providing
            an access token which does not expire using this credential type, then the same functionality may be
            achieved by using a simple API key and OAuth 2.0 need not be used.
      required:
