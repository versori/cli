        type:
          $ref: "#/components/schemas/AuthSchemeConfigOAuth2GrantType"
      required:
        - type

    AuthSchemeConfigNone:
      title: None
      description: |
        A placeholder object with the schemeType set to `none`. There is no other configuration
        required.
      type: object
      allOf:
        - $ref: "#/components/schemas/AuthSchemeConfigBase"

    AuthSchemeConfigBasicAuth:
      title: Basic Auth
      description: |
        A placeholder object with the schemeType set to `basic-auth`. There is no other
        configuration required.
      type: object
      allOf:
        - $ref: "#/components/schemas/AuthSchemeConfigBase"

    AuthSchemeConfigCertificate:
      title: TLS Certificate
      description: |
        A placeholder object with the schemeType set to `certificate`.
        There is no other config required
      type: object
      allOf:
        - $ref: "#/components/schemas/AuthSchemeConfigBase"

    AuthSchemeConfigOAuth2:
      title: OAuth 2.0
      description: |
        How a Connector uses an OAuth2 credential to authenticate
        with the system. This is to be used for all OAuth 2.0 flows which require a client ID and
        client secret as part of the Connector's configuration. Connectors which use the
        `client_credentials` grant type, where the user provides the Client ID  and Client Secret at
        the point where they connect, should use the `AuthSchemeConfigOAuth2ClientCredentials` type
        instead.
      type: object
      allOf:
        - $ref: "#/components/schemas/AuthSchemeConfigBase"
        - type: object
          properties:
            authorizeUrl:
              type: string
              format: uri
              description: |
                The URL which the user will be redirected to in order to authorize
                the application.
              x-go-name: AuthorizeURL
              x-go-type-skip-optional-pointer: true
            tokenUrl:
              type: string
              format: uri
              description: |
                The URL which the application will use to issue an access token.
              x-go-name: TokenURL
            refreshUrl:
              type: string
              format: uri
              description: |
                The URL which the application will use to refresh an access token. If omitted, TokenURL is used.
              x-go-name: RefreshURL
              x-go-type-skip-optional-pointer: true
            scopes:
              description: |
                The list of all OAuth2 scopes which the application supports. The user
                will be allowed to choose which scopes to request when configuring the Connection.
              type: array
              items:
                $ref: "#/components/schemas/OAuth2Scope"
            defaultScopes:
              description: |
                The list of scopes which will be requested by default when the user
                connects the Connector. This is useful for Connectors which require a specific set
                of scopes to function correctly.
              type: array
              items:
                type: string
            additionalAuthorizeParams:
              description: |
                A URL-encoded query string which should be attached to
                the AuthorizeURL when the user is redirected to the OAuth 2.0 authorization
                endpoint.

                This value is only used by the UI to drive the default values when connecting, the
                API to `InitialiseOAuth2Connection` can be provided a different value if required.
              type: string
              x-go-type-skip-optional-pointer: true
            additionalTokenParams:
              description: |
                A URL-encoded string following the
                `application/x-www-form-urlencoded` mime-type, which can be used to pass additional
                parameters to the OAuth 2.0 token endpoint within the request body.
              type: string
              x-go-type-skip-optional-pointer: true
            additionalTokenParamConfigs:
              description: |
                A list of configurations that control how additional
                parameters (defined in additionalTokenParams) are placed in requests to the OAuth
                2.0 token endpoint. Each config defines where a parameter should be sent (body,
                header, query) and where its value comes from. If a parameter is present in
                additionalTokenParams but has no matching config, the default behaviour is
                grant-type dependent.
              type: array
              items:
                $ref: "#/components/schemas/OAuth2ParameterConfig"
              x-go-type-skip-optional-pointer: true
            mtlsEnabled:
              type: boolean
              description: |
                A flag which determines whether the Connector should use Mutual TLS
                (mTLS) to authenticate with the OAuth 2.0 token endpoint. This is useful for
                Connectors which require a higher level of security.
              x-go-name: MTLSEnabled
              x-go-type-skip-optional-pointer: true
            mtlsCredentialId:
              type: string
              description: |
                The unique identifier of the Credential which contains the
                client certificate and private key to be used as part of the mTLS connection.

                This may be unset when creating a connection, in which case if `mtlsEnabled` is
                true, then the API will find an associated AuthSchemeConfigCertificate and link
                them automatically.
              x-go-name: MTLSCredentialID
            pkce:
              type: boolean
              x-go-type-skip-optional-pointer: true
            grant:
              $ref: "#/components/schemas/AuthSchemeConfigOAuth2Grant"
          required:
            - tokenUrl
            - scopes
            - defaultScopes
            - grant

    AuthSchemeConfigOAuth1:
      title: OAuth 2.0
