  /o/{organisation_id}/usage/{metric}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - name: metric
        in: path
        required: true
        description: |
          Metric name from the platform usage registry, e.g. `kv.ops.read`,
          `project.cpu.allocation`, `org.members`. The full list of supported
          metrics is validated server-side; unknown values return 400.
        schema:
          type: string
    get:
      operationId: GetOrganisationUsage
      summary: Query platform usage for a single metric.
      description: |
        Returns time-bucketed usage for a single metric in `[start, end)`.
        The range is capped at 30 days. For project-scoped metrics, omit
        `project_id` to receive one series per project; pass `project_id`
        to filter to a single project. Org-level metrics ignore `project_id`.
      tags:
        - usage
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive start of the query range, RFC3339.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: Exclusive end of the query range, RFC3339. Must be after `start` and within 30 days of it.
          schema:
            type: string
            format: date-time
        - name: project_id
          in: query
          required: false
          description: Optional project ULID. Only valid for project-scoped metrics; rejects with 400 otherwise.
          schema:
            type: string
            format: ulid
            x-go-type: ulid.ULID
            x-go-type-import:
              path: github.com/versori/cli/pkg/ulid
        - name: granularity
          in: query
          required: false
          description: |
            Bucket size for the returned series. One of `15m`, `1h`, `6h`, `1d`.
            When omitted, the server picks a sensible default from the range
            (`<=24h -> 15m`, `<=7d -> 1h`, `<=30d -> 6h`). Ignored for
            `view=latest`.
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: |
            Aggregation view. `series` (default) returns a time-bucketed
            series. `latest` returns the most recent value per project (and an
            org-wide rollup in `summary.latest`) and is only valid for gauge
            metrics; requesting it for a counter returns 400.
          schema:
            type: string
            enum:
              - series
              - latest
        - name: group_by
          in: query
          required: false
          description: |
            Grouping for project-scoped metrics. `project` (default) returns one
            series per project; `org` sums the per-project series into a single
            org-level series. Ignored for org-scoped metrics and when
            `project_id` is supplied.
          schema:
            type: string
            enum:
              - project
              - org
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "501":
          description: Usage querying is disabled in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

