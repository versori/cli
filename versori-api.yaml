        - required
        - modifiable
        - parameterName

    OAuth2ParameterConfig:
      description: |
        How an additional parameter should be handled when making
        requests to the OAuth 2.0 token endpoint. This controls where the parameter is placed
        (body, header, query) and where its value comes from.
      type: object
      properties:
        parameterName:
          type: string
          description: Key of the additional parameter to insert.
        targetName:
          type: string
          description: |
            Override name for the parameter in the token endpoint request. If not set, the
            parameter will be sent using the same name as parameterName.
          x-go-type-skip-optional-pointer: true
        location:
          type: string
          description: Defines where this parameter should be placed in the request.
          enum:
            - LOCATION_IGNORE
            - LOCATION_BODY
            - LOCATION_HEADER
            - LOCATION_QUERY
        from:
          type: string
          description: Defines where the value of this parameter should be taken from.
          enum:
            - FROM_ADDITIONAL_PARAMS
            - FROM_RANDOM_UUID
        grantTypes:
          type: array
          description: |
            List of grant types for which this parameter should be included. If empty, the
            parameter will be handled according to this configuration for all grant types.
          items:
            type: string
          x-go-type-skip-optional-pointer: true
      required:
        - parameterName
        - location
        - from

    AuthSchemeConfigHMACIn:
      description: Where the signature should be set on requests.
      type: string
      enum:
        - query
        - header
        - cookie
    AuthSchemeConfigHMAC:
      title: HMAC
      description: |
        How a Connector uses an HMAC credential to authenticate with the system.

        This may be used on outbound requests to sign the request body, however it is more commonly used on inbound
        requests (i.e. from Webhook Triggers) to verify the sender of the request is allowed to invoke the Trigger.
      type: object
      allOf:
        - $ref: "#/components/schemas/AuthSchemeConfigBase"
        - type: object
          properties:
            name:
              type: string
              description: The query parameter/header/cookie name which will be used to send the signature.
            in:
              $ref: "#/components/schemas/AuthSchemeConfigHMACIn"
            algorithm:
              description: AuthSchemeConfigHMACAlgorithm defines the hashing algorithm to use when generating the HMAC signature.
              type: string
              enum:
                - sha1
                - sha256
                - sha512
            digestInputs:
              description: |
                AuthSchemeConfigHMACInputs defines what parts of a HTTP request are consumed to generate the HMAC signature. Some systems
                only generate the signature from the request body, others may include the URL. The order of this array
                defines the order in which the input is fed into the hashing function.
              type: array
              items:
                type: string
                enum:
                  - body
                  - url
            encoding:
              description: |
                How the HMAC signature was encoded. This can be one of `hex`, `base64` or `base64url`.
              type: string
              enum:
                - hex
                - base64
                - base64url
          required:
            - name
            - in
            - algorithm
            - digestInputs
            - encoding

