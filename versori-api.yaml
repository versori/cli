        authorizeUrl:
          description: |
            The URL which the user will be redirected to in order to authorize
            the application.
          type: string
          format: uri
          x-go-name: AuthorizeURL
        redirectUrl:
          description: |
            The URL which the user will be redirected to after authorising the application.
          type: string
          format: uri
          x-go-name: RedirectURL
        clientId:
          description: |
            The OAuth 2.0 client ID which is used to identify the application to the
            OAuth 2.0 provider.
          type: string
          x-go-name: ClientID
        scopes:
          description: |
            A list of OAuth 2.0 scopes which the application is requesting access to.

            Unless `disableOfflineAccess` is set to true, the API will also include the standard
            `offline_access` scope in addition to the ones provided here.
          type: array
          items:
