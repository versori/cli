          type: string
        provider:
          $ref: "#/components/schemas/GitProviderType"
        instanceUrl:
          type: string
        externalUserId:
          description: The user ID returned by the Git provider's userinfo endpoint.
          type: string
        externalUsername:
          description: The username returned by the Git provider's userinfo endpoint.
          type: string
        externalDisplayName:
          type: string
        externalAvatarUrl:
          type: string
        connectedAt:
          type: string
          format: date-time
      required:
        - id
        - organisationId
        - userId
        - provider
        - instanceUrl
        - externalUserId
        - externalUsername
        - connectedAt

    GitUserConnectionList:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/GitUserConnection"
      required:
        - connections

    OrgGitRepositoryBinding:
      description: A Git repository currently linked to an integration in the organisation.
      type: object
      properties:
        repositoryId:
          type: string
        provider:
          $ref: "#/components/schemas/GitProviderType"
        instanceUrl:
          type: string
        repoOwner:
          type: string
        repoName:
          type: string
        projectId:
          type: string
        projectName:
          type: string
      required:
        - repositoryId
        - provider
        - instanceUrl
        - repoOwner
        - repoName
        - projectId
        - projectName

    OrgGitRepositoryBindingList:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/OrgGitRepositoryBinding"
      required:
        - bindings

    GitRepository:
      description: |
        A repository the user can access through a Git connection. Field set is the minimum needed by the picker UI;
        provider-specific extras (visibility, archived flags, etc) are filtered out server-side.
      type: object
      properties:
        id:
          description: Provider-side repository identifier (GitLab numeric ID as string, GitHub `owner/repo`, etc).
          type: string
        name:
          type: string
        fullName:
          description: |
            Human-readable namespaced name, e.g. `group/subgroup/repo` for GitLab or `owner/repo` for GitHub.
          type: string
        defaultBranch:
          type: string
          nullable: true
        webUrl:
          type: string
      required:
        - id
        - name
        - fullName
        - webUrl

    GitRepositoryList:
      type: object
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/GitRepository"
      required:
        - repositories

    GitBranch:
      type: object
      properties:
        name:
          type: string
        isDefault:
          type: boolean
        isProtected:
          type: boolean
      required:
        - name
        - isDefault
        - isProtected

    GitBranchList:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/GitBranch"
      required:
        - branches

    GetProjectGitBindingResponse:
      description: |
        Wrapper for the `GET /git-binding` response so the endpoint can signal "no binding" with a normal 200
        response. `binding` is present when the project is linked, omitted/null when it is not.
      type: object
      properties:
        binding:
          $ref: "#/components/schemas/ProjectGitBinding"

    ProjectGitBinding:
      description: Per-project binding to a Git repository. Shared across all org members.
      type: object
      properties:
        projectId:
          type: string
        gitConnectionId:
          description: ID of the git_user_connection that performed the link (for audit only; runtime calls use the calling user's own connection).
          type: string
        provider:
          $ref: "#/components/schemas/GitProviderType"
        instanceUrl:
          type: string
        repositoryId:
          description: Provider-side repository identifier (e.g. GitLab numeric project ID).
          type: string
        repoOwner:
          description: Everything before the last slash in the repo's full path (e.g. group/subgroup).
          type: string
        repoName:
          description: Last segment of the repo's full path.
          type: string
        defaultBranch:
          type: string
        currentBranch:
          type: string
        lastSyncedSha:
          type: string
        linkedBy:
          description: Versori user ID of whoever last (re)linked the project.
          type: string
        linkedAt:
          type: string
          format: date-time
      required:
        - projectId
        - gitConnectionId
        - provider
        - instanceUrl
        - repositoryId
        - repoOwner
        - repoName
        - defaultBranch
        - currentBranch
        - linkedBy
        - linkedAt

    ProjectGitBindingUpsert:
      description: Body for PUT - everything the picker collected from the user.
      type: object
      properties:
        gitConnectionId:
          type: string
        repositoryId:
          type: string
        repoOwner:
          type: string
        repoName:
          type: string
        defaultBranch:
          type: string
        currentBranch:
          description: |
            Legacy single-branch field, retained for backward compatibility with clients that pre-date
            per-environment branch bindings. New clients should set this to `defaultBranch` and use the
            per-environment binding APIs (and the per-user working branch API) for branch routing.
          type: string
      required:
        - gitConnectionId
        - repositoryId
        - repoOwner
        - repoName
        - defaultBranch
        - currentBranch

    DeploymentMode:
      description: |
        How Versori reacts to changes on an environment's mapped branch.
          - manual_only: deploys happen only when a user clicks Deploy in the UI or hits the deploy API.
          - external_ci_cd: Versori never triggers deployments for this environment. An external CI/CD pipeline owns the deployment.
      type: string
      enum:
        - manual_only
        - external_ci_cd

    EnvironmentGitBinding:
      description: |
        Per-environment binding mapping a Versori environment to a Git branch and a deployment mode. The project must
        already be linked via `ProjectGitBinding`; this binding inherits the project's provider, instance, and repo.
      type: object
      properties:
        projectId:
          type: string
        environmentId:
          type: string
          format: ulid
          x-go-type: ulid.ULID
          x-go-name: EnvironmentID
          x-go-type-import:
            path: github.com/versori/cli/pkg/ulid
        branchName:
          description: Git branch this environment tracks and deploys from.
          type: string
        deploymentMode:
          $ref: "#/components/schemas/DeploymentMode"
        lastDeployedSha:
          description: Most recent commit SHA Versori deployed for this environment from the mapped branch.
          type: string
        boundBy:
          description: Versori user ID of whoever last (re)bound the environment.
          type: string
        boundAt:
          type: string
          format: date-time
      required:
        - projectId
        - environmentId
        - branchName
        - deploymentMode
        - boundBy
        - boundAt

    EnvironmentGitBindingUpsert:
      description: Body for PUT - per-env mapping plus optional branch creation.
      type: object
      properties:
        branchName:
          description: Git branch this environment will track.
          type: string
        deploymentMode:
          $ref: "#/components/schemas/DeploymentMode"
        createFromBranch:
          description: |
            When set and `branchName` does not exist on the repository, create it from this base branch before
            persisting the binding. When unset, the binding fails if `branchName` does not exist.
          type: string
          x-go-type-skip-optional-pointer: true
      required:
        - branchName
        - deploymentMode

    EnvironmentGitBindingList:
      description: Per-project list of environment Git bindings.
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/EnvironmentGitBinding"
      required:
        - bindings

    ProjectWorkingBranch:
      description: Per-(user, project) working branch where the user commits before promoting changes to env-mapped branches.
      type: object
      properties:
        projectId:
          type: string
        userId:
          type: string
        branchName:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - projectId
        - userId
        - branchName
        - updatedAt

    ProjectWorkingBranchUpsert:
      description: Body for PUT - working branch plus optional branch creation.
      type: object
      properties:
        branchName:
          type: string
        createFromBranch:
          description: |
            When set and `branchName` does not exist on the repository, create it from this base branch before
            persisting the working branch. When unset, the upsert fails if `branchName` does not exist.
          type: string
          x-go-type-skip-optional-pointer: true
      required:
        - branchName

    EntitlementCatalogItem:
      type: object
      description: A single feature entry in the static entitlements catalog.
      properties:
        key:
          type: string
          description: Stable identifier used in grants and decisions.
        displayName:
          type: string
        description:
          type: string
        category:
          type: string
          description: Grouping label for the feature, e.g. `ai` or `projects`.
        defaultEnabled:
          type: boolean
          description: Whether the feature is enabled for orgs with no explicit grant.
      required:
        - key
        - displayName
        - description
        - category
        - defaultEnabled

    EntitlementCatalog:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: "#/components/schemas/EntitlementCatalogItem"
      required:
        - features

    QuotaCatalogItem:
      type: object
      description: A single quota entry in the static quotas catalog.
      properties:
        key:
          type: string
          description: Stable identifier used in grants and decisions.
        displayName:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/QuotaKind"
        defaultLimit:
          type: number
          x-go-type: float64
        defaultEnforcement:
          $ref: "#/components/schemas/QuotaEnforcement"
        gatingEntitlement:
          type: string
          description: Entitlements key that gates this quota; empty when always active.
      required:
        - key
        - displayName
        - description
        - kind
        - defaultLimit
        - defaultEnforcement
        - gatingEntitlement

    QuotaCatalog:
      type: object
      properties:
        quotas:
          type: array
          items:
            $ref: "#/components/schemas/QuotaCatalogItem"
      required:
        - quotas

    EntitlementSource:
      type: string
      description: |
        Origin of the grant that produced this decision. `default` means no
        explicit grant exists and the catalog default was applied. `trial` is a
        time-boxed limited grant; once expired it forces the feature off rather
        than falling back to the default.
      enum:
        - default
        - manual_admin
        - stripe
        - trial
        - plan_default

    EntitlementDecision:
      type: object
      description: Resolved enabled/disabled decision for a single entitlement feature.
      properties:
        featureKey:
          type: string
          description: Catalog key for the feature.
        displayName:
          type: string
        enabled:
          type: boolean
        source:
          $ref: "#/components/schemas/EntitlementSource"
        reason:
          type: string
          description: Human-readable explanation of why the decision was made.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the grant expires; absent if it does not expire.
      required:
        - featureKey
        - displayName
        - enabled
        - source
        - reason

    EntitlementDecisionList:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/EntitlementDecision"
      required:
        - decisions

    QuotaSource:
      type: string
      description: |
        Origin of the grant that produced this decision. `default` means no
        explicit grant exists and the catalog default was applied. `trial` is a
        time-boxed limited grant; once expired it forces a deny (limit 0, hard
        enforcement) rather than falling back to the default.
      enum:
        - default
        - manual_admin
        - stripe
        - trial
        - plan_default

    QuotaEnforcement:
      type: string
      description: |
        What the platform does when the quota is exceeded. `soft` logs and
        alerts; `hard` blocks the operation; `disabled` means the quota is
        tracked but not enforced.
      enum:
        - soft
        - hard
        - disabled

    QuotaKind:
      type: string
      description: |
        The measurement window for the quota. `lifetime` is a cumulative
        all-time counter; `month` resets each calendar month; `second` is a
        per-second rate enforced on the hot path.
      enum:
        - lifetime
        - month
        - second

    QuotaDecision:
      type: object
      description: |
        Resolved limit, usage, and enforcement for a single quota. `usage` is
        populated from the slow-path quota_usage table for `lifetime` and
        `month` quotas; it is 0 for `second` quotas whose usage lives in
        Redis.
      properties:
        quotaKey:
          type: string
          description: Catalog key for the quota.
        displayName:
          type: string
        limit:
          type: number
          x-go-type: float64
          description: Resolved upper limit for the quota.
        usage:
          type: number
          x-go-type: float64
          description: Current consumed value for the active period; 0 when untracked.
        enforcement:
          $ref: "#/components/schemas/QuotaEnforcement"
        kind:
          $ref: "#/components/schemas/QuotaKind"
        unit:
          type: string
          description: Dimension of `limit` and `usage`, e.g. `count`, `bytes`, `tokens`.
        periodBucket:
          type: string
          description: |
            The period the `usage` value covers: `lifetime` for lifetime quotas,
            `YYYY-MM` for monthly quotas, empty for hot-path quotas.
        periodStart:
          type: string
          format: date-time
          nullable: true
          description: Inclusive start of the current period window; absent for untimed quotas.
        periodEnd:
          type: string
          format: date-time
          nullable: true
          description: Exclusive end of the current period window; absent for untimed quotas.
        gatingEntitlement:
          type: string
          description: |
            Entitlements catalog key that gates this quota; empty when the quota
            is always active.
        gateEnabled:
          type: boolean
          description: Whether the gating entitlement is enabled. Always true when there is no gate.
        source:
          $ref: "#/components/schemas/QuotaSource"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the grant expires; absent if it does not expire.
      required:
        - quotaKey
        - displayName
        - limit
        - usage
        - enforcement
        - kind
        - unit
        - periodBucket
        - gatingEntitlement
        - gateEnabled
        - source

    QuotaDecisionList:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/QuotaDecision"
      required:
        - decisions

