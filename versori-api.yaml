      operationId: CreateBinding
      summary: Creates a binding for use in a project.
      description: |
        Creates a binding for use in a project. If you pass an environmentID in the request body, this will create a binding
        for use in that specific environment only. Names of bindings must be unique within a project, however, environment
        specific bindings can have the same names and will override project bindings.
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBindingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/bindings/{name}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/project_env'
      - name: name
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: DeleteBinding
      summary: Deletes a binding for a project.
      tags:
        - projects
      description: |
        Deletes a binding for a project. This operation only unlinks the binding, the underlying connection/kv store
        etc are left untouched. If you need to remove an environment binding then you can use the `project_env` query
        parameter to specify the environment by name or ID.
      responses:
        '204':
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/bindings/{binding_name}/activation-binding/{name}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/project_env'
      - name: binding_name
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: DeleteActivationBinding
      summary: Deletes an activation binding from the parent binding.
      responses:
        '204':
          description: OK
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /o/{organisation_id}/entitlements:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListOrganisationEntitlements
      summary: List resolved entitlement decisions for an organisation.
      description: |
        Returns the resolved enabled/disabled decision for every feature in the
        entitlements catalog. Features the organisation has no explicit grant for
        are resolved against the catalog default, so the response always contains
        the full catalog.
      tags:
        - billing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementDecisionList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/entitlements/catalog:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListEntitlementsCatalog
      summary: List the static entitlements feature catalog.
      description: |
        Returns every feature in the catalog regardless of whether this
        organisation has any grants. Useful for building dropdowns or
        admin UIs that need to enumerate all possible feature keys.
        The response is identical for every organisation — it reflects the
        global catalog, not org-specific grant state.
      tags:
        - billing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementCatalog"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/entitlements/{feature_key}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - name: feature_key
        in: path
        required: true
        description: |
          Entitlements catalog key for the feature, e.g. `ai.copilot` or
          `projects.custom_domains`. Unknown keys return 404.
        schema:
          type: string
    get:
      operationId: GetOrganisationEntitlement
      summary: Get the resolved entitlement decision for a single feature.
      tags:
        - billing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementDecision"
        "404":
          description: Feature key not found in the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/quotas:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListOrganisationQuotas
      summary: List resolved quota decisions for an organisation.
      description: |
        Returns the resolved limit and current usage for every quota in the
        catalog. Quotas with no explicit grant are resolved against the catalog
        default. The `usage` field is populated from the slow-path quota_usage
        table and reflects the current period bucket (e.g. the current calendar
        month for monthly quotas).
      tags:
        - billing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaDecisionList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/quotas/catalog:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListQuotasCatalog
      summary: List the static quotas catalog.
      description: |
        Returns every quota in the catalog regardless of whether this
        organisation has any grants. Includes the default limit, enforcement,
        kind, and unit for each quota. Useful for building dropdowns or admin
        UIs that need to enumerate all possible quota keys.
        The response is identical for every organisation — it reflects the
        global catalog, not org-specific grant state.
      tags:
        - billing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaCatalog"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/quotas/{quota_key}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - name: quota_key
        in: path
        required: true
        description: |
          Quotas catalog key, e.g. `projects.max` or `ai.tokens.month`. Unknown
          keys return 404.
        schema:
          type: string
    get:
      operationId: GetOrganisationQuota
      summary: Get the resolved quota decision for a single quota.
      tags:
        - billing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaDecision"
        "404":
          description: Quota key not found in the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Git OAuth — per-user authorisation against an Organisation's configured
  # Git provider. The provider configuration (instance URL, client_id, client
  # secret) lives in organisations-api; this surface drives the user-facing
  # OAuth dance and stores the issued tokens in the credentials service.
  # ---------------------------------------------------------------------------

  /o/{organisation_id}/git/{provider}/oauth/initialise:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/git_provider"
    post:
      operationId: InitialiseGitOAuth
      summary: Begin a per-user Git OAuth 2.0 authorisation
      description: |
        Generates a PKCE-protected `state` plus a fully-formed authorisation URL for the provider configured at the
        organisation level. The frontend opens this URL in a popup; on completion it calls `CompleteGitOAuth`.
      tags:
        - git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialiseGitOAuthRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialiseGitOAuthResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/{provider}/oauth/complete:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/git_provider"
    post:
      operationId: CompleteGitOAuth
      summary: Finalise a Git OAuth 2.0 authorisation
      description: |
        Exchanges the authorisation `code` (sent back to the redirect URI) for an access token via the credentials
        service, then resolves the external user identity and stores a `GitUserConnection` row binding the
        Versori user to the issued credential.
      tags:
        - git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteGitOAuthRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitUserConnection"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/{provider}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/git_provider"
    delete:
      operationId: PurgeGitProviderData
      summary: Purge all Git data tied to an organisation's provider
      description: |
        Internal endpoint invoked by organisations-api when an organisation's Git provider configuration is removed.
        Cascades that removal into platform-api by deleting every user's Git connection on the provider plus every
        project Git binding (and its dependent per-environment bindings and per-user working branches) within the
        organisation, so nothing Git-related lingers after the provider it depended on is gone. Idempotent.
      tags:
        - git
      responses:
        "204":
          description: Purged
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/connections:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListGitUserConnections
      summary: List the calling user's Git connections in this organisation
      description: |
        Returns one row per (provider, instance) the calling user has authorised. Used by the frontend to render the
        "Connected to GitLab as @alice" panel and to decide whether to prompt for re-authorisation.
      tags:
        - git
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitUserConnectionList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/connections/{git_connection_id}:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/git_connection_id"
    delete:
      operationId: DeleteGitUserConnection
      summary: Disconnect a user's Git authorisation
      description: |
        Removes the `GitUserConnection` row and best-effort deletes the backing credential. Subsequent operations that
        require Git access for this user will require re-authorisation.
      tags:
        - git
      responses:
        "204":
          description: Deleted
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/connections/{git_connection_id}/repositories:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/git_connection_id"
    get:
      operationId: ListGitRepositories
      summary: List repositories accessible via a Git connection
      description: |
        Proxies the provider's "list repositories" API using the connection's stored access token, returning a stable
        subset of fields the UI needs to render a picker. The frontend never sees the access token itself.
      tags:
        - git
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Optional case-insensitive search filter applied by the provider.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepositoryList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/connections/{git_connection_id}/branches:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/git_connection_id"
    get:
      operationId: ListGitBranches
      summary: List branches of a repository accessible via a Git connection
      description: |
        Proxies the provider's "list branches" API for a specific repository. `repositoryId` is the provider-side
        repository identifier returned by `ListGitRepositories`.
      tags:
        - git
      parameters:
        - in: query
          name: repositoryId
          schema:
            type: string
          required: true
          description: Provider-side repository identifier returned by ListGitRepositories.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitBranchList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/git/repository-bindings:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
    get:
      operationId: ListOrgGitRepositoryBindings
      summary: List Git repository bindings for all projects in the organisation
      description: |
        Returns which repositories are already linked to integrations in this organisation. Used by the repo picker to
        disable repositories that are taken by another project.
      tags:
        - git
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgGitRepositoryBindingList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/git-binding:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: GetProjectGitBinding
      summary: Get the Git binding for a project
      description: |
        Returns a wrapper carrying the project's Git binding when linked, or `{ "binding": null }` when the project
        has not been linked to a Git repository. Always 200; callers can use the same response to gate dependent
        queries (per-environment bindings, working branch) without an error round-trip.
      tags:
        - git
      responses:
        "200":
          description: OK (binding when linked, null when not)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProjectGitBindingResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: UpsertProjectGitBinding
      summary: Link or relink a project to a Git repository
      description: |
        Creates the binding the first time, updates it on every subsequent call. The binding is shared across
        all org members - whoever opens the project sees the same link. The calling user must own the referenced
        git connection; that user is recorded as `linkedBy` for audit.
      tags:
        - git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGitBindingUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitBinding"
        "409":
          description: Repository is already linked to another integration in this organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: DeleteProjectGitBinding
      summary: Unlink a project from its Git repository
      description: Removes the project's binding row. No-op if no binding exists.
      tags:
        - git
      responses:
        "204":
          description: Unlinked
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/git/environment-bindings:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: ListEnvironmentGitBindings
      summary: List per-environment Git bindings for a project
      description: |
        Returns one row per environment that has been mapped to a Git branch. Environments without a mapping
        are omitted. The project must already be linked via `/git-binding`.
      tags:
        - git
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentGitBindingList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/environments/{environment_id}/git-binding:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/environment_id"
    get:
      operationId: GetEnvironmentGitBinding
      summary: Get the Git binding for a single environment
      description: |
        Returns the environment's Git branch + deployment mode binding. 404 when this environment has not yet
        been mapped to a branch. The project must already be linked via `/git-binding`.
      tags:
        - git
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentGitBinding"
        "404":
          description: No binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: UpsertEnvironmentGitBinding
      summary: Create or update the Git binding for a single environment
      description: |
        Maps the environment to a Git branch with a deployment mode. The project must already be linked via
        `/git-binding`. If `createFromBranch` is set and `branchName` does not yet exist on the repository,
        the branch is created from that base before the binding is saved.
      tags:
        - git
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentGitBindingUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentGitBinding"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: DeleteEnvironmentGitBinding
      summary: Remove the Git binding for a single environment
      description: |
        Idempotent. Removes the environment's branch mapping; does not delete the branch on the Git provider.
      tags:
        - git
      responses:
        "204":
          description: Unmapped
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /o/{organisation_id}/projects/{project_id}/git/working-branch:
    parameters:
      - $ref: "#/components/parameters/organisation_id"
      - $ref: "#/components/parameters/project_id"
    get:
      operationId: GetProjectWorkingBranch
      summary: Get the calling user's working branch for the project
      description: |
        Working branches are scoped per (user, project) so different developers can iterate independently
        on the same project without stepping on each other. 404 when the user has not picked a working
        branch yet.
      tags:
        - git
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkingBranch"
        "404":
          description: No working branch picked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: UpsertProjectWorkingBranch
      summary: Set the calling user's working branch for the project
      description: |
        Records the branch the calling user is currently writing on. Commits from the Build tab push to this
        branch. If `createFromBranch` is set and `branchName` does not yet exist on the repository, the
        branch is created from that base before the binding is saved.
      tags:
        - git
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkingBranchUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkingBranch"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: DeleteProjectWorkingBranch
      summary: Clear the calling user's working branch for the project
      description: Idempotent. Removes the user's working branch preference; does not delete the branch on the Git provider.
      tags:
        - git
      responses:
        "204":
          description: Cleared
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

security:
  - bearerToken: [ ]
  - cookie: [ ]
components:
  schemas:
    KVKey:
      type: array
      items:
        type: string
    KVEntry:
      type: object
      properties:
        key:
          "$ref": "#/components/schemas/KVKey"
        value:
          description: Any JSON-serializable value
        versionstamp:
          type: string
          description: Unique version identifier for optimistic concurrency
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the entry expires (TTL)
      required:
        - key
        - value
        - versionstamp
        - createdAt
    KVBatchFailure:
      type: object
      properties:
        key:
          "$ref": "#/components/schemas/KVKey"
        error:
          type: string
      required:
        - key
        - error
    KVCommitResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the operation was successful
        versionstamp:
          type: string
          description: New version identifier
        committed:
          type: boolean
          description: Whether the transaction was committed
      required:
        - ok
        - versionstamp
        - committed
    KVBatchResult:
      type: object
      properties:
        successes:
          type: array
          items:
            $ref: '#/components/schemas/KVCommitResult'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/KVBatchFailure'
      required:
        - successes
        - failures
    SetOptions:
      type: object
      properties:
        expireIn:
          type: number
          description: TTL in milliseconds
        expireAt:
          type: string
          format: date-time
          description: Absolute expiration time
        refreshOnAccess:
          type: boolean
          description: Whether to refresh TTL on access
        ifVersionstamp:
          type: string
          description: Only set if current versionstamp matches
        ifNotExists:
          type: boolean
          description: Only set if key doesn't exist
        overwrite:
          type: boolean
          description: Whether to overwrite existing values
        metadata:
          type: object
          description: Additional metadata to store with the entry
    GetOptions:
      type: object
      properties:
        timeout:
          type: number
          description: Request timeout in milliseconds
    ListOptions:
      type: object
      properties:
        limit:
          type: number
          minimum: 1
          maximum: 100
          default: 100
          description: Maximum number of entries to return
        reverse:
          type: boolean
          description: Whether to reverse the sort order
    DeleteOptions:
      type: object
      properties:
        ifVersionstamp:
          type: string
          description: Only delete if current versionstamp matches
        cascade:
          type: boolean
          description: Delete all keys with this prefix
    KVFilter:
      type: object
      properties:
        createdAfter:
          type: string
          format: date-time
          description: Filter entries created after this date
        createdBefore:
          type: string
          format: date-time
          description: Filter entries created before this date
        metadata:
          type: object
          description: Filter by metadata properties
    ListSelector:
      type: object
      properties:
        prefix:
          type: array
          items:
            type: string
        before:
          type: string
        after:
          type: string
        filter:
          $ref: '#/components/schemas/KVFilter'
    CreateStoreRequest:
      type: object
      properties:
        name:
          type: string
    CreateStoreResponse:
      type: object
      properties:
        id:
          type: string
          format: ulid
          x-go-type: ulid.ULID
          x-go-name: StoreID
          x-go-type-import:
            path: github.com/versori/cli/pkg/ulid
    BatchEntry:
      type: object
      properties:
        key:
          type: array
          items:
            type: string
        value:
          description: Any JSON value
        options:
          $ref: '#/components/schemas/SetOptions'
      required:
        - key
        - value
    BatchEntries:
